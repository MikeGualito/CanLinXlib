[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canlinxliblin"
version = "0.5.0"
description = "Python API for the LIN channel of a CanLinX USB interface"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]
# Conservative placeholder: no terms are granted until this is decided.
license = { text = "Proprietary - all rights reserved" }

[tool.setuptools.packages.find]
include = ["canlinxliblin*"]

# Ships the PEP 561 marker so type checkers use the annotations in consumers.
[tool.setuptools.package-data]
canlinxliblin = ["py.typed"]
